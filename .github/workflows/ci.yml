name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests migrations

  test-sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=gear_sync --cov-report=term-missing

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gear
          POSTGRES_PASSWORD: gear
          POSTGRES_DB: gear_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gear -d gear_test"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://gear:gear@localhost:5432/gear_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=gear_sync --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: [test-sqlite, test-postgres]
    steps:
      - uses: actions/checkout@v4
      - name: Sobe o stack e testa a API
        run: |
          docker compose up -d --build --wait db gear-mock api
          docker compose run --rm sync
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/condominios | python -c "import json,sys; d=json.load(sys.stdin); assert len(d)==5, d; print(len(d), 'condomínios')"
      - if: always()
        run: docker compose down -v
